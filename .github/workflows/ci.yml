name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Debugger adapter tests
        run: node --test viewer/model.test.mjs
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Exact invariance tests
        run: ctest --test-dir build -L wgphysics --output-on-failure
      - name: Fiber demo
        run: ./build/fiber_demo
      - name: Research milestones demo
        run: |
          ./build/research_demo
          ./build/cell_dynamics_demo
      - name: Deterministic fiber census
        run: |
          ./build/wgphysics_census --output out/fiber-census.json
          diff -u data/fiber-census-n4.json out/fiber-census.json
          ./build/wgphysics_product_census --output out/rule-fiber-census.json
          diff -u data/rule-fiber-census-subdivision.json out/rule-fiber-census.json
          ./build/wgphysics_dynamics_census --output out/d4-cell-dynamics-census.json
          diff -u data/d4-cell-dynamics-census.json out/d4-cell-dynamics-census.json
          ./build/wgphysics_pair_census --output out/pair-interactions.json
          diff -u data/d4-pair-interactions.json out/pair-interactions.json
          ./build/wgphysics_chain_experiments --output out/chain-experiments.json
          diff -u data/d4-chain-experiments.json out/chain-experiments.json
          ./build/wgphysics_involution_census --output out/pair-involutions.json
          diff -u data/d4-pair-involutions.json out/pair-involutions.json
          ./build/wgphysics_involution_braid_search --output out/involution-braid-search.json
          diff -u data/d4-involution-braid-search.json out/involution-braid-search.json
          python3 tools/screen_braid_rules.py --output out/braid-rule-screen.json
          diff -u data/d4-braid-rule-screen.json out/braid-rule-screen.json
          python3 tools/charge_quotient.py --output out/charge-quotient.json
          diff -u data/d4-charge-quotient.json out/charge-quotient.json
          python3 tools/classify_braid_quotients.py --output out/braid-quotient-classification.json
          diff -u data/d4-braid-quotient-classification.json out/braid-quotient-classification.json
      - name: Exact effective dynamics and microscopic transport smoke test
        run: |
          python3 tests/effective_dynamics.py
          python3 tools/run_diffusion_experiment.py --trials 32 --cells 144 --layers 32 --output out/diffusion-smoke.json
      - name: Shared-face feedback census and mesh evolution smoke test
        run: |
          python3 tests/shared_mesh.py
          python3 tools/run_mesh_experiments.py --side 4 --layers 16 --trials 1 --output out/shared-mesh-smoke.json
          python3 tests/shared_edge.py
          python3 tools/run_shared_edge.py --side 4 --layers 32 --trials 2 --full-replay --output out/shared-edge-smoke.json
          python3 tools/run_shared_edge.py --full-replay --output out/shared-edge.json
          diff -u data/d4-shared-edge.json out/shared-edge.json
      - name: Exact observable memory and face-energy obstruction
        run: |
          python3 tests/observable_memory.py
          python3 tests/face_energy.py
          python3 tools/mesh_observable_audit.py --output out/mesh-observable-audit.json
          diff -u data/d4-mesh-observable-audit.json out/mesh-observable-audit.json
          python3 tools/face_energy_obstruction.py --output out/face-energy-obstruction.json
          diff -u data/d4-face-energy-obstruction.json out/face-energy-obstruction.json
      - name: Three-face conserved feedback and independent link replay
        run: |
          python3 tools/triple_rule_search.py --output out/triple-rule-search.json
          diff -u data/d4-triple-rule-search.json out/triple-rule-search.json
          python3 tests/three_face.py
          python3 tools/run_three_face.py --side 4 --layers 32 --trials 2 --full-replay --output out/three-face-smoke.json
          python3 tests/three_face_reachability.py
          python3 tools/three_face_reachability.py --side 3 --exhaustive --random-trials 8 --sweeps 1000 --output out/reachability-3.json
          diff -u data/d4-three-face-reachability-3.json out/reachability-3.json
      - name: Positive noncommuting channel banks and mixed-arity link dynamics
        run: |
          python3 tools/triple_channels.py --output out/triple-channels.json
          diff -u data/d4-triple-channels.json out/triple-channels.json
          python3 tests/channel_banks.py
          python3 tools/run_channel_banks.py --output out/channel-banks.json
          diff -u data/d4-channel-banks.json out/channel-banks.json
      - name: Reachable nonabelian equilibrium and raw-link residence statistics
        run: |
          python3 tests/bank_equilibrium.py
          python3 tools/bank_equilibrium.py --trials 4 --component data/d4-bank-equilibrium.json --output out/bank-equilibrium.json
          diff -u data/d4-bank-equilibrium.json out/bank-equilibrium.json
      - name: Complete loop observer and independent gauge-quotient check
        # The complete-loop probe is separately checked against the original
        # gauge quotient; timing output is diagnostic, never a CI threshold.
        run: |
          python3 tests/d4_loop_observer.py
          python3 tools/d4_loop_observer.py --output out/d4-loop-observer.json
          diff -u data/d4-loop-observer.json out/d4-loop-observer.json
          python3 tests/fiber_mode_probe.py
          python3 tools/fiber_mode_probe.py --output out/fiber-mode-probe.json
          diff -u data/d4-fiber-mode-probe.json out/fiber-mode-probe.json
          ./build/wgphysics_loop_bench --smoke
      - name: Localized fiber modes and exact infinite-lattice witness
        env:
          OPENBLAS_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          python3 -m venv out/spectral-venv
          out/spectral-venv/bin/pip install 'numpy>=2,<3' 'scipy>=1.14,<2' python-flint
          out/spectral-venv/bin/python tests/mode_localization.py
          out/spectral-venv/bin/python tools/compact_mode_certificate.py --verify data/d4-compact-mode-certificate.json
          out/spectral-venv/bin/python tools/mode_localization.py --sides 6 --large-sides --evolution-side 6 --attempts 2000 --stride 1000 --trials 1 --output out/mode-localization-smoke.json
          out/spectral-venv/bin/python tools/spectral_transition.py --output out/spectral-transition.json
          out/spectral-venv/bin/python tools/spectral_transition.py --verify-with-flint data/d4-spectral-transition.json
          out/spectral-venv/bin/python tests/transport_braid.py
          out/spectral-venv/bin/python tools/transport_braid.py --output out/transport-braid.json
      - name: Derived-fiber transport and exact projective braid action
        # This dataset contains exact values only, unlike the D4 mode estimates.
        env:
          OPENBLAS_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          out/spectral-venv/bin/python tests/fiber_transport.py
          out/spectral-venv/bin/python tools/fiber_transport.py --output out/fiber-transport.json
          diff -u data/fiber-transport-order.json out/fiber-transport.json
          out/spectral-venv/bin/python tests/unrouted_transport.py
          out/spectral-venv/bin/python tools/unrouted_transport.py --output out/unrouted-transport.json
          diff -u data/unrouted-transport.json out/unrouted-transport.json
      - name: Triangle-fiber reaction feedback and raw braid-memory readout
        env:
          OPENBLAS_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          out/spectral-venv/bin/python tests/triangle_feedback.py
          out/spectral-venv/bin/python tools/triangle_feedback.py --output out/triangle-feedback.json
          diff -u data/triangle-feedback.json out/triangle-feedback.json
      - name: Full-bundle compact localization certificates and exact mode-loss audit
        env:
          OPENBLAS_NUM_THREADS: '1'
          VECLIB_MAXIMUM_THREADS: '1'
        run: |
          out/spectral-venv/bin/python tools/triangle_modes.py --verify-only
          out/spectral-venv/bin/python tests/triangle_modes.py
      - name: Multiway engine smoke test
        run: |
          ./build/wgphysics_evolve --steps 2 --output out/smoke.json
          ./build/wgphysics_product_evolve --steps 2 --output out/product-smoke.json
      - name: Validate JSON output
        run: |
          python3 -m json.tool out/smoke.json > /dev/null
          python3 -m json.tool out/product-smoke.json > /dev/null
          python3 -m json.tool out/fiber-census.json > /dev/null
          python3 -m json.tool out/rule-fiber-census.json > /dev/null
          python3 -m json.tool out/d4-cell-dynamics-census.json > /dev/null
