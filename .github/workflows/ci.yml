name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Debugger adapter tests
        run: node --test viewer/model.test.mjs
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Exact invariance tests
        run: ctest --test-dir build -L wgphysics --output-on-failure
      - name: Fiber demo
        run: ./build/fiber_demo
      - name: Research milestones demo
        run: |
          ./build/research_demo
          ./build/cell_dynamics_demo
      - name: Deterministic fiber census
        run: |
          ./build/wgphysics_census --output out/fiber-census.json
          diff -u data/fiber-census-n4.json out/fiber-census.json
          ./build/wgphysics_product_census --output out/rule-fiber-census.json
          diff -u data/rule-fiber-census-subdivision.json out/rule-fiber-census.json
          ./build/wgphysics_dynamics_census --output out/d4-cell-dynamics-census.json
          diff -u data/d4-cell-dynamics-census.json out/d4-cell-dynamics-census.json
          ./build/wgphysics_pair_census --output out/pair-interactions.json
          diff -u data/d4-pair-interactions.json out/pair-interactions.json
      - name: Multiway smoke test
        run: |
          ./build/wgphysics_evolve --steps 2 --output out/smoke.json
          ./build/wgphysics_product_evolve --steps 2 --output out/product-smoke.json
      - name: Validate JSON output
        run: |
          python3 -m json.tool out/smoke.json > /dev/null
          python3 -m json.tool out/product-smoke.json > /dev/null
          python3 -m json.tool out/fiber-census.json > /dev/null
          python3 -m json.tool out/rule-fiber-census.json > /dev/null
          python3 -m json.tool out/d4-cell-dynamics-census.json > /dev/null
