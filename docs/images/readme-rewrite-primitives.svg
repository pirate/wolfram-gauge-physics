<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc"><title id="title">A local rewrite changes the network</title><desc id="desc">Specified rule: consume edges (0,1) and (0,2); produce (0,2), (0,3), (1,3), (2,3). Node 3 is fresh. The two panels are graph layouts, not physical coordinates. This is the rule in the README export command.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55e0d2"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b69aff"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc46b"/></marker></defs><rect width="1200" height="628" rx="24" fill="#0b1221"/><g font-family="Helvetica,Arial,sans-serif"><text x="36" y="42" font-size="16" fill="#55e0d2" text-anchor="start">THE NETWORK ITSELF CHANGES</text><text x="36" y="87" font-size="34" fill="#f1f5fc" text-anchor="start">A rewrite replaces relationships—not positions.</text><rect x="26" y="120" width="508" height="350" rx="18" fill="#121e32" stroke="#425775"/><rect x="666" y="120" width="508" height="350" rx="18" fill="#121e32" stroke="#425775"/><text x="54" y="160" font-size="22" fill="#ffc46b" text-anchor="start">BEFORE · matched pattern</text><text x="694" y="160" font-size="22" fill="#55e0d2" text-anchor="start">AFTER · replacement</text><line x1="360" y1="280" x2="145" y2="220" stroke="#ffc46b" stroke-width="4" /><line x1="360" y1="280" x2="145" y2="367" stroke="#ffc46b" stroke-width="4" /><circle cx="360" cy="280" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="360" y="287" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="145" cy="220" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="145" y="227" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="145" cy="367" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="145" y="374" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><line x1="1020" y1="285" x2="735" y2="380" stroke="#55e0d2" stroke-width="4" /><line x1="1020" y1="285" x2="850" y2="285" stroke="#55e0d2" stroke-width="4" /><line x1="735" y1="205" x2="850" y2="285" stroke="#55e0d2" stroke-width="4" /><line x1="735" y1="380" x2="850" y2="285" stroke="#55e0d2" stroke-width="4" /><circle cx="1020" cy="285" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="1020" y="292" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="735" cy="205" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="735" y="212" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="735" cy="380" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="735" y="387" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><circle cx="850" cy="285" r="23" fill="#0b1221" stroke="#55e0d2" stroke-width="3"/><text x="850" y="292" font-size="21" fill="#55e0d2" text-anchor="middle">3</text><text x="280" y="440" font-size="21" fill="#b3c2d7" text-anchor="middle">2 relationships consumed</text><text x="920" y="440" font-size="21" fill="#b3c2d7" text-anchor="middle">4 produced · node 3 is new</text><path d="M552 285H644" fill="none" stroke="#55e0d2" stroke-width="3" marker-end="url(#cyan)"/><text x="600" y="332" font-size="19" fill="#b3c2d7" text-anchor="middle">apply</text><text x="600" y="358" font-size="19" fill="#b3c2d7" text-anchor="middle">the rule</text><text x="36" y="515" font-size="23" fill="#ffc46b" text-anchor="start">Before: (0,1), (0,2)</text><text x="666" y="515" font-size="23" fill="#55e0d2" text-anchor="start">After: (0,2), (0,3), (1,3), (2,3)</text><text x="36" y="562" font-size="23" fill="#f1f5fc" text-anchor="start">The numbers are names. The lines are the data. The drawing has no physical scale.</text><text x="36" y="599" font-size="20" fill="#b3c2d7" text-anchor="start">Even (0,2) is consumed and produced again: same endpoints, a new edge occurrence.</text></g></svg>
