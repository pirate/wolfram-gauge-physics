<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc"><title id="title">Holonomy in a triangle fiber</title><desc id="desc">Four panels show A, B, C, then A again. Two identity transports followed by a rotation move marker 0 from slot 0 to slot 1 at the same base vertex.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55e0d2"/></marker></defs><g font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="535" rx="24" fill="#0b1221"/><text x="36" y="43" fill="#55e0d2" font-size="15" text-anchor="start" letter-spacing="2">TRANSPORT AROUND A LOOP</text><text x="36" y="82" fill="#f1f5fc" font-size="28" text-anchor="start" >Return to the same place. Keep a different internal alignment.</text><text x="36" y="113" fill="#a8b8d0" font-size="17" text-anchor="start" >A chosen three-link connection with a triangle fiber; not a recorded trajectory.</text><rect x="39" y="147" width="214" height="256" rx="18" fill="#121e32" stroke="#354764"/><text x="146" y="182" fill="#f1f5fc" font-size="21" text-anchor="middle" >A · start</text><line x1="146" y1="229" x2="211" y2="337" stroke="#354764" stroke-width="4" /><line x1="211" y1="337" x2="81" y2="337" stroke="#354764" stroke-width="4" /><line x1="81" y1="337" x2="146" y2="229" stroke="#354764" stroke-width="4" /><circle cx="146" cy="229" r="21" fill="#55e0d2"/><text x="146" y="236" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">0</text><text x="146" y="198" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 0</text><circle cx="211" cy="337" r="21" fill="#b69aff"/><text x="211" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="211" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 1</text><circle cx="81" cy="337" r="21" fill="#ffc46b"/><text x="81" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="81" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 2</text><line x1="257" y1="277" x2="336" y2="277" stroke="#55e0d2" stroke-width="3" marker-end="url(#arrow)"/><text x="297.5" y="254" fill="#55e0d2" font-size="15" text-anchor="middle" >identity</text><rect x="342" y="147" width="214" height="256" rx="18" fill="#121e32" stroke="#354764"/><text x="449" y="182" fill="#f1f5fc" font-size="21" text-anchor="middle" >B</text><line x1="449" y1="229" x2="514" y2="337" stroke="#354764" stroke-width="4" /><line x1="514" y1="337" x2="384" y2="337" stroke="#354764" stroke-width="4" /><line x1="384" y1="337" x2="449" y2="229" stroke="#354764" stroke-width="4" /><circle cx="449" cy="229" r="21" fill="#55e0d2"/><text x="449" y="236" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">0</text><text x="449" y="198" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 0</text><circle cx="514" cy="337" r="21" fill="#b69aff"/><text x="514" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="514" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 1</text><circle cx="384" cy="337" r="21" fill="#ffc46b"/><text x="384" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="384" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 2</text><line x1="560" y1="277" x2="639" y2="277" stroke="#55e0d2" stroke-width="3" marker-end="url(#arrow)"/><text x="600.5" y="254" fill="#55e0d2" font-size="15" text-anchor="middle" >identity</text><rect x="645" y="147" width="214" height="256" rx="18" fill="#121e32" stroke="#354764"/><text x="752" y="182" fill="#f1f5fc" font-size="21" text-anchor="middle" >C</text><line x1="752" y1="229" x2="817" y2="337" stroke="#354764" stroke-width="4" /><line x1="817" y1="337" x2="687" y2="337" stroke="#354764" stroke-width="4" /><line x1="687" y1="337" x2="752" y2="229" stroke="#354764" stroke-width="4" /><circle cx="752" cy="229" r="21" fill="#55e0d2"/><text x="752" y="236" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">0</text><text x="752" y="198" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 0</text><circle cx="817" cy="337" r="21" fill="#b69aff"/><text x="817" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="817" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 1</text><circle cx="687" cy="337" r="21" fill="#ffc46b"/><text x="687" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="687" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 2</text><line x1="863" y1="277" x2="942" y2="277" stroke="#55e0d2" stroke-width="3" marker-end="url(#arrow)"/><text x="903.5" y="254" fill="#55e0d2" font-size="15" text-anchor="middle" >+1</text><rect x="948" y="147" width="214" height="256" rx="18" fill="#121e32" stroke="#354764"/><text x="1055" y="182" fill="#f1f5fc" font-size="21" text-anchor="middle" >A · return</text><line x1="1055" y1="229" x2="1120" y2="337" stroke="#354764" stroke-width="4" /><line x1="1120" y1="337" x2="990" y2="337" stroke="#354764" stroke-width="4" /><line x1="990" y1="337" x2="1055" y2="229" stroke="#354764" stroke-width="4" /><circle cx="1055" cy="229" r="21" fill="#ffc46b"/><text x="1055" y="236" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">2</text><text x="1055" y="198" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 0</text><circle cx="1120" cy="337" r="21" fill="#55e0d2"/><text x="1120" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">0</text><text x="1120" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 1</text><circle cx="990" cy="337" r="21" fill="#b69aff"/><text x="990" y="344" fill="#0b1221" font-size="21" text-anchor="middle" font-weight="700">1</text><text x="990" y="376" fill="#a8b8d0" font-size="13" text-anchor="middle" >slot 2</text><rect x="36" y="428" width="1128" height="83" rx="18" fill="#152a36" stroke="#28736d"/><text x="58" y="461" fill="#55e0d2" font-size="20" text-anchor="start" >Follow marker 0:</text><text x="248" y="461" fill="#f1f5fc" font-size="20" text-anchor="start" >it starts in slot 0 and returns in slot 1.</text><text x="58" y="488" fill="#a8b8d0" font-size="18" text-anchor="start" >The loop’s net map is a rotation. This net map is its holonomy.</text></g></svg>