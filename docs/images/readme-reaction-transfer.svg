4" fill="#0b1221" font-size="17" text-anchor="middle" font-weight="700">R · 1</text><text x="1020" y="341.34272207354934" fill="#26334d" font-size="12" text-anchor="middle" >f3</text><polygon points="1020,275 1102,275 1061,346.01408311032395" fill="#b69aff" fill-opacity="0.84" stroke="#0b1221" stroke-width="3"/><text x="1061" y="301.67136103677467" fill="#0b1221" font-size="17" text-anchor="middle" font-weight="700">R · 1</text><text x="1061" y="317.67136103677467" fill="#26334d" font-size="12" text-anchor="middle" >f2</text><line x1="1020" y1="275" x2="979" y2="346.01408311032395" stroke="#55e0d2" stroke-width="4" /><line x1="1020" y1="275" x2="1061" y2="346.01408311032395" stroke="#55e0d2" stroke-width="4" /><text x="873" y="405" fill="#a8b8d0" font-size="14" text-anchor="middle" >source</text><text x="873" y="440" fill="#b69aff" font-size="30" text-anchor="middle" font-weight="700">1</text><text x="990" y="405" fill="#a8b8d0" font-size="14" text-anchor="middle" >shared</text><text x="990" y="440" fill="#b69aff" font-size="30" text-anchor="middle" font-weight="700">1</text><text x="1107" y="405" fill="#a8b8d0" font-size="14" text-anchor="middle" >destination</text><text x="1107" y="440" fill="#ffc46b" font-size="30" text-anchor="middle" font-weight="700">2</text><rect x="24" y="497" width="1152" height="90" rx="18" fill="#152a36" stroke="#28736d"/><text x="45" y="534" fill="#55e0d2" font-size="14" text-anchor="start" letter-spacing="1.5">NET CHANGE</text><text x="224" y="534" fill="#ffc46b" font-size="22" text-anchor="start" >source −1</text><line x1="353" y1="527" x2="505" y2="527" stroke="#55e0d2" stroke-width="3" marker-end="url(#arrow)"/><text x="526" y="534" fill="#ffc46b" font-size="22" text-anchor="start" >destination +1</text><text x="1150" y="534" fill="#f1f5fc" font-size="19" text-anchor="end" >Total Q = 52 throughout</text><text x="45" y="565" fill="#a8b8d0" font-size="16" text-anchor="start" >Cyan lines: changed raw links. E / R / Z: identity / reflection / rotation. The arrow shows net balance, not a path.</text></g></svg>