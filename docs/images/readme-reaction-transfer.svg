<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title desc"><title id="title">Charge transfer through two neighboring reactions</title><desc id="desc">The saved raw-link witness keeps total charge 52. Face 3 changes 2 to 2 to 1; shared face 0 changes 1 to 0 to 1; face 6 changes 1 to 2 to 2. Cyan edges are the actual changed links.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55e0d2"/></marker></defs><g font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="612" rx="24" fill="#0b1221"/><text x="36" y="43" fill="#55e0d2" font-size="15" text-anchor="start" letter-spacing="2">TWO REACTIONS · ONE NET TRANSFER</text><text x="36" y="83" fill="#f1f5fc" font-size="30" text-anchor="start" >A shared face connects two local reactions.</text><text x="36" y="115" fill="#a8b8d0" font-size="17" text-anchor="start" >Saved C₅ shared-link states • five-face patch unwrapped from a periodic mesh</text><rect x="24" y="143" width="368" height="332" rx="18" fill="#121e32" stroke="#354764"/><text x="44" y="181" fill="#f1f5fc" font-size="22" text-anchor="start" >01  Before</text><text x="44" y="210" fill="#a8b8d0" font-size="16" text-anchor="start" >Neighboring reaction is inactive</text><polygon points="154,275 113,346.01408311032395 72,275" fill="#b69aff" fill-opacity="0.84" stroke="#0b1221" stroke-width="3"/><text x="113" y="301.67136103677467" fill="#0b1221" font-size="17" text-anchor="middle" font-weight="700">R · 1</text><text x="113" y="317.67136103677467" fill="#26334d" font-size="12" text-anchor="middle" >f6</text><polygon points="154,275 195,346.01408311032395 113,346.01408311032395" fill="#b69aff" fill-opacity="0.84" stroke="#0b1221" stroke-width="3"/><text x="154" y="325.34272207354934" fill="#0b1221" font-size="17" text-anchor="middle" font-weight="700">R · 1</text><text x="154" y="341.34272207354934" fill="#26334d" font-size="12" text-anchor="middle" >f1</text><polygon points="154,275 236,275 195,346.01408311032395" fill="#b69aff" fill-opacity="0.84" stroke="#0b1221" stroke-width="3"/><text x="195" y="301.67136103677467" fill="#0b1221" font-size="17" text-anchor="middle" font-weight="700">R · 1</text><text x="195" y="317.67136103677467" fill="#26334d" font-size="12" text-anchor="middle" >f0</text><polygon points="236,275 277,346.01408311032395 195,346.01408311032395" fill="#ffc46b" fill-opacity="0.84" stroke="#0b1221" stroke-width="3"/><text x="236" y="325.34272207354934" fill="#0b1221" font-size="17" text-anchor="middle" font-weight="700">Z · 2</text><text x="236" y="341.34272207354934" fill="#26334d" font-size="12" text-anchor="middle" >f3</text><polygon points="236,275 318,275 277,346.01408311032395" fill="#b69aff" fill-opacity="0.84" stroke="#0b1221" stroke-width="3"/><text x="277" y="301.67136103677467" fill="#0b1221" font-size="17" text-anchor="middle" font-weight="700">R · 1</text><text x="277" y="317.67136103677467" fill="#26334d" font-size="12" text-anchor="middle" >f2</text><text x="89" y="405" fill="#a8b8d0" font-size="14" text-anchor="middle" >source</text><text x="89" y="440" fill="#ffc46b" font-size="30" text-anchor="middle" font-weight="700">2</text><text x="206" y="405" fill="#a8b8d0" font-size="14" text-anchor="middle" >shared</text><text x="206" y="440" fill="#b69aff" font-size="30" text-anchor="middle" font-weight="700">1</text><text x="323" y="405" fill="#a8b8d0" font-size="14" text-anchor="middle" >destination</text><text x="323" y="440" fill="#b69aff" font-size="30" text-anchor="middle" font-weight="700">1</text><rect x="416" y="143" width="368" height="332" rx="18" fill="#121e32" stroke="#354764"/><text x="436" y="181" fill="#f1f5fc" font-size="22" text-anchor="start" >02  After first reaction</text><text x="436" y="210" fill="#a8b8d0" font-size="16" text-anchor="start" >Shared face becomes flat</text><polygon poi