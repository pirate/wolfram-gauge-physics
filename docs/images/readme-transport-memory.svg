<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="588" viewBox="0 0 1200 588" role="img" aria-labelledby="title desc"><title id="title">Transport order changes the complete connection</title><desc id="desc">Circuit A then B takes gauge state 0 through 0 to 1. Circuit B then A takes 0 through 1 to 2. The two final connections have the same face classes but are not gauge equivalent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55e0d2"/></marker></defs><g font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="588" rx="24" fill="#0b1221"/><text x="36" y="43" fill="#55e0d2" font-size="15" text-anchor="start" letter-spacing="2">ORDER OF TRANSPORT</text><text x="36" y="83" fill="#f1f5fc" font-size="30" text-anchor="start" >Same circuits. Different order. Different connection.</text><text x="36" y="115" fill="#a8b8d0" font-size="17" text-anchor="start" >Recorded action on complete gauge states, starting from state 0 in both cases.</text><rect x="24" y="152" width="1152" height="139" rx="18" fill="#121e32" stroke="#354764"/><text x="48" y="192" fill="#a8b8d0" font-size="16" text-anchor="start" letter-spacing="1.5">A THEN B</text><circle cx="238" cy="224" r="36" fill="#0b1221" stroke="#f1f5fc" stroke-width="2"/><text x="238" y="235" fill="#f1f5fc" font-size="31" text-anchor="middle" >0</text><text x="238" y="282" fill="#a8b8d0" font-size="14" text-anchor="middle" >gauge state</text><line x1="288" y1="224" x2="560" y2="224" stroke="#55e0d2" stroke-width="3" /><path d="M 560 217 L 574 224 L 560 231" fill="#55e0d2"/><text x="426" y="207" fill="#55e0d2" font-size="19" text-anchor="middle" >circuit A</text><circle cx="614" cy="224" r="36" fill="#0b1221" stroke="#f1f5fc" stroke-width="2"/><text x="614" y="235" fill="#f1f5fc" font-size="31" text-anchor="middle" >0</text><text x="614" y="282" fill="#a8b8d0" font-size="14" text-anchor="middle" >gauge state</text><line x1="664" y1="224" x2="936" y2="224" stroke="#ffc46b" stroke-width="3" /><path d="M 936 217 L 950 224 L 936 231" fill="#ffc46b"/><text x="802" y="207" fill="#ffc46b" font-size="19" text-anchor="middle" >circuit B</text><circle cx="990" cy="224" r="36" fill="#0b1221" stroke="#b69aff" stroke-width="2"/><text x="990" y="235" fill="#b69aff" font-size="31" text-anchor="middle" >1</text><text x="990" y="282" fill="#a8b8d0" font-size="14" text-anchor="middle" >final connection</text><rect x="24" y="318" width="1152" height="139" rx="18" fill="#121e32" stroke="#354764"/><text x="48" y="358" fill="#a8b8d0" font-size="16" text-anchor="start" letter-spacing="1.5">B THEN A</text><circle cx="238" cy="390" r="36" fill="#0b1221" stroke="#f1f5fc" stroke-width="2"/><text x="238" y="401" fill="#f1f5fc" font-size="31" text-anchor="middle" >0</text><text x="238" y="448" fill="#a8b8d0" font-size="14" text-anchor="middle" >gauge state</text><line x1="288" y1="390" x2="560" y2="390" stroke="#ffc46b" stroke-width="3" /><path d="M 560 383 L 574 390 L 560 397" fill="#ffc46b"/><text x="426" y="373" fill="#ffc46b" font-size="19" text-anchor="middle" >circuit B</text><circle cx="614" cy="390" r="36" fill="#0b1221" stroke="#f1f5fc" stroke-width="2"/><text x="614" y="401" fill="#f1f5fc" font-size="31" text-anchor="middle" >1</text><text x="614" y="448" fill="#a8b8d0" font-size="14" text-anchor="middle" >gauge state</text><line x1="664" y1="390" x2="936" y2="390" stroke="#55e0d2" stroke-width="3" /><path d="M 936 383 L 950 390 L 936 397" fill="#55e0d2"/><text x="802" y="373" fill="#55e0d2" font-size="19" text-anchor="middle" >circuit A</text><circle cx="990" cy="390" r="36" fill="#0b1221" stroke="#ffc46b" stroke-width="2"/><text x="990" y="401" fill="#ffc46b" font-size="31" text-anchor="middle" >2</text><text x="990" y="448" fill="#a8b8d0" font-size="14" text-anchor="middle" >final connection</text><rect x="24" y="485" width="1152" height="78" rx="18" fill="#152a36" stroke="#28736d"/><text x="45" y="518" fill="#f1f5fc" font-size="21" text-anchor="start" >Every defect returns to its face. Every face keeps the same class.</text><text x="45" y="547" fill="#a8b8d0" font-size="18" text-anchor="start" >The difference is in the relationships between loops. A face-color map does not show it.</text></g></svg>