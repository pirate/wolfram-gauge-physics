<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="687" viewBox="0 0 1200 687" role="img" aria-labelledby="title desc"><title id="title">A fiber is an internal graph attached to one base node</title><desc id="desc">Three connected base nodes A, B, and C each have a three-vertex internal triangle graph. Dashed projection lines associate every triangle with its base node. The vertical separation is diagrammatic, not an extra spatial dimension.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55e0d2"/></marker></defs><g font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="687" rx="24" fill="#0b1221"/><text x="36" y="43" fill="#55e0d2" font-size="15" text-anchor="start" letter-spacing="2">WHAT IS A FIBER?</text><text x="36" y="83" fill="#f1f5fc" font-size="29" text-anchor="start" >One location. A separate space of internal possibilities.</text><text x="36" y="116" fill="#a8b8d0" font-size="17" text-anchor="start" >The base graph connects locations. A fiber graph describes the internal structure at one location.</text><rect x="24" y="144" width="1152" height="250" rx="18" fill="#121e32" stroke="#354764"/><text x="48" y="179" fill="#55e0d2" font-size="16" text-anchor="start" letter-spacing="1.5">FIBERS</text><line x1="250" y1="220" x2="303" y2="308" stroke="#b69aff" stroke-width="3" /><line x1="303" y1="308" x2="197" y2="308" stroke="#b69aff" stroke-width="3" /><line x1="197" y1="308" x2="250" y2="220" stroke="#b69aff" stroke-width="3" /><circle cx="250" cy="220" r="17" fill="#b69aff"/><text x="250" y="226" fill="#0b1221" font-size="17" text-anchor="middle" >0</text><circle cx="303" cy="308" r="17" fill="#b69aff"/><text x="303" y="314" fill="#0b1221" font-size="17" text-anchor="middle" >1</text><circle cx="197" cy="308" r="17" fill="#b69aff"/><text x="197" y="314" fill="#0b1221" font-size="17" text-anchor="middle" >2</text><text x="250" y="359" fill="#f1f5fc" font-size="18" text-anchor="middle" >fiber at A</text><line x1="250" y1="376" x2="250" y2="473" stroke="#a8b8d0" stroke-width="2" stroke-dasharray="5 6"/><text x="262" y="428" fill="#a8b8d0" font-size="14" text-anchor="start" >belongs to</text><line x1="600" y1="220" x2="653" y2="308" stroke="#b69aff" stroke-width="3" /><line x1="653" y1="308" x2="547" y2="308" stroke="#b69aff" stroke-width="3" /><line x1="547" y1="308" x2="600" y2="220" stroke="#b69aff" stroke-width="3" /><circle cx="600" cy="220" r="17" fill="#b69aff"/><text x="600" y="226" fill="#0b1221" font-size="17" text-anchor="middle" >0</text><circle cx="653" cy="308" r="17" fill="#b69aff"/><text x="653" y="314" fill="#0b1221" font-size="17" text-anchor="middle" >1</text><circle cx="547" cy="308" r="17" fill="#b69aff"/><text x="547" y="314" fill="#0b1221" font-size="17" text-anchor="middle" >2</text><text x="600" y="359" fill="#f1f5fc" font-size="18" text-anchor="middle" >fiber at B</text><line x1="600" y1="376" x2="600" y2="473" stroke="#a8b8d0" stroke-width="2" stroke-dasharray="5 6"/><text x="612" y="428" fill="#a8b8d0" font-size="14" text-anchor="start" >belongs to</text><line x1="950" y1="220" x2="1003" y2="308" stroke="#b69aff" stroke-width="3" /><line x1="1003" y1="308" x2="897" y2="308" stroke="#b69aff" stroke-width="3" /><line x1="897" y1="308" x2="950" y2="220" stroke="#b69aff" stroke-width="3" /><circle cx="950" cy="220" r="17" fill="#b69aff"/><text x="950" y="226" fill="#0b1221" font-size="17" text-anchor="middle" >0</text><circle cx="1003" cy="308" r="17" fill="#b69aff"/><text x="1003" y="314" fill="#0b1221" font-size="17" text-anchor="middle" >1</text><circle cx="897" cy="308" r="17" fill="#b69aff"/><text x="897" y="314" fill="#0b1221" font-size="17" text-anchor="middle" >2</text><text x="950" y="359" fill="#f1f5fc" font-size="18" text-anchor="middle" >fiber at C</text><line x1="950" y1="376" x2="950" y2="473" stroke="#a8b8d0" stroke-width="2" stroke-dasharray="5 6"/><text x="962" y="428" fill="#a8b8d0" font-size="14" text-anchor="start" >belongs to</text><line x1="275" y1="504" x2="575" y2="504" stroke="#55e0d2" stroke-width="4" /><line x1="625" y1="504" x2="925" y2="504" stroke="#55e0d2" stroke-width="4" /><text x="48" y="510" fill="#55e0d2" font-size="15" text-anchor="start" letter-spacing="1">BASE GRAPH</text><circle cx="250" cy="504" r="26" fill="#0b1221" stroke="#55e0d2" stroke-width="3"/><text x="250" y="512" fill="#f1f5fc" font-size="23" text-anchor="middle" >A</text><circle cx="600" cy="504" r="26" fill="#0b1221" stroke="#55e0d2" stroke-width="3"/><text x="600" y="512" fill="#f1f5fc" font-size="23" text-anchor="middle" >B</text><circle cx="950" cy="504" r="26" fill="#0b1221" stroke="#55e0d2" stroke-width="3"/><text x="950" y="512" fill="#f1f5fc" font-size="23" text-anchor="middle" >C</text><text x="425" y="536" fill="#a8b8d0" font-size="15" text-anchor="middle" >spatial relationship</text><text x="775" y="536" fill="#a8b8d0" font-size="15" text-anchor="middle" >spatial relationship</text><rect x="24" y="569" width="1152" height="94" rx="18" fill="#152a36" stroke="#28736d"/><text x="46" y="603" fill="#f1f5fc" font-size="23" text-anchor="start" >A fiber node is not another location in ordinary space.</text><text x="46" y="634" fill="#a8b8d0" font-size="17" text-anchor="start" >Vertical separation is for the drawing only. Each entire triangle belongs to the single base node below it.</text></g></svg>