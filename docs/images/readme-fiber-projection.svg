<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742" role="img" aria-labelledby="title desc"><title id="title">A fiber as alternatives over one coarse description</title><desc id="desc">A chosen coarse observer keeps endpoint identities 0 and 3 and whether they are connected. It maps both a four-node path and a four-node cycle to the same description. Both lie in its set-theoretic fiber. This does not imply dynamical or gauge equivalence. The projection is an explicit illustrative assumption, not a derived physical observer.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55e0d2"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b69aff"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc46b"/></marker></defs><rect width="1200" height="742" rx="24" fill="#0b1221"/><g font-family="Helvetica,Arial,sans-serif"><text x="36" y="42" font-size="16" fill="#55e0d2" text-anchor="start">THE MISSING FIBER CONSTRUCTION</text><text x="36" y="87" font-size="33" fill="#f1f5fc" text-anchor="start">Which details disappear in a coarser description?</text><rect x="26" y="128" width="485" height="456" rx="18" fill="#121e32" stroke="#b69aff"/><text x="53" y="171" font-size="20" fill="#b69aff" text-anchor="start">TWO DIFFERENT DETAILED STATES</text><line x1="95" y1="255" x2="212" y2="222" stroke="#b69aff" stroke-width="4" /><line x1="212" y1="222" x2="328" y2="282" stroke="#b69aff" stroke-width="4" /><line x1="328" y1="282" x2="440" y2="255" stroke="#b69aff" stroke-width="4" /><circle cx="95" cy="255" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="95" y="262" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="212" cy="222" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="212" y="229" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="328" cy="282" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="328" y="289" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><circle cx="440" cy="255" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="440" y="262" font-size="21" fill="#f1f5fc" text-anchor="middle">3</text><text x="268" y="334" font-size="21" fill="#b3c2d7" text-anchor="middle">an open chain</text><line x1="95" y1="440" x2="212" y2="390" stroke="#b69aff" stroke-width="4" /><line x1="212" y1="390" x2="328" y2="390" stroke="#b69aff" stroke-width="4" /><line x1="328" y1="390" x2="440" y2="440" stroke="#b69aff" stroke-width="4" /><line x1="440" y1="440" x2="95" y2="440" stroke="#b69aff" stroke-width="4" /><circle cx="95" cy="440" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="95" y="447" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="212" cy="390" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="212" y="397" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="328" cy="390" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="328" y="397" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><circle cx="440" cy="440" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="440" y="447" font-size="21" fill="#f1f5fc" text-anchor="middle">3</text><text x="268" y="552" font-size="21" fill="#b3c2d7" text-anchor="middle">a closed loop</text><path d="M525 278L748 338" fill="none" stroke="#55e0d2" stroke-width="3" marker-end="url(#cyan)"/><path d="M525 468L748 408" fill="none" stroke="#55e0d2" stroke-width="3" marker-end="url(#cyan)"/><text x="637" y="211" font-size="18" fill="#55e0d2" text-anchor="middle">CHOSEN OBSERVER</text><text x="637" y="244" font-size="20" fill="#f1f5fc" text-anchor="middle">keeps endpoints</text><text x="637" y="513" font-size="20" fill="#f1f5fc" text-anchor="middle">and whether they</text><text x="637" y="541" font-size="20" fill="#f1f5fc" text-anchor="middle">are connected</text><rect x="770" y="240" width="404" height="268" rx="18" fill="#121e32" stroke="#425775"/><text x="972" y="288" font-size="19" fill="#55e0d2" text-anchor="middle">ONE COARSE DESCRIPTION x</text><line x1="852" y1="362" x2="1087" y2="362" stroke="#55e0d2" stroke-width="4" /><circle cx="852" cy="362" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="852" y="369" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="1087" cy="362" r="23" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="1087" y="369" font-size="21" fill="#f1f5fc" text-anchor="middle">3</text><text x="972" y="443" font-size="23" fill="#f1f5fc" text-anchor="middle">“0 and 3 are connected”</text><text x="36" y="633" font-size="24" fill="#f1f5fc" text-anchor="start">Both detailed states belong to the fiber over x under this projection.</text><text x="36" y="675" font-size="22" fill="#ffc46b" text-anchor="start">But they need not behave alike. Grouping them does not make them gauge-equivalent.</text><text x="36" y="712" font-size="21" fill="#b3c2d7" text-anchor="start">The research task: derive a useful projection and transport from the rewriting process itself.</text></g></svg>
