<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="987" viewBox="0 0 1200 987" role="img" aria-labelledby="title desc"><title id="title">Branching histories versus causal dependencies</title><desc id="desc">Two independent subdivisions A and B can happen in either order and reach the same graph. The multiway diagram branches and merges. A later joining event C consumes an edge produced by A and an edge produced by B, so its causal graph has A to C and B to C, but no A to B edge. Specified illustrative example, not a sampled physical process.</desc><defs><marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55e0d2"/></marker><marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b69aff"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffc46b"/></marker></defs><rect width="1200" height="987" rx="24" fill="#0b1221"/><g font-family="Helvetica,Arial,sans-serif"><text x="36" y="42" font-size="16" fill="#55e0d2" text-anchor="start">TWO DIFFERENT GRAPHS</text><text x="36" y="87" font-size="34" fill="#f1f5fc" text-anchor="start">Possible histories are not causal dependencies.</text><text x="36" y="134" font-size="21" fill="#b3c2d7" text-anchor="start">MULTIWAY · each box is a whole labeled network state</text><rect x="37" y="269" width="286" height="132" rx="18" fill="#121e32" stroke="#425775"/><text x="180" y="302" font-size="22" fill="#f1f5fc" text-anchor="middle">start</text><line x1="62" y1="349" x2="180" y2="349" stroke="#425775" stroke-width="3" /><line x1="180" y1="349" x2="298" y2="349" stroke="#425775" stroke-width="3" /><circle cx="62" cy="349" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="62" y="356" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="180" cy="349" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="180" y="356" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="298" cy="349" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="298" y="356" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><rect x="457" y="163" width="286" height="132" rx="18" fill="#121e32" stroke="#425775"/><text x="600" y="196" font-size="22" fill="#55e0d2" text-anchor="middle">after A</text><line x1="482" y1="243" x2="560.6666666666666" y2="243" stroke="#425775" stroke-width="3" /><line x1="560.6666666666666" y1="243" x2="639.3333333333334" y2="243" stroke="#425775" stroke-width="3" /><line x1="639.3333333333334" y1="243" x2="718" y2="243" stroke="#425775" stroke-width="3" /><circle cx="482" cy="243" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="482" y="250" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="560.6666666666666" cy="243" r="17" fill="#0b1221" stroke="#55e0d2" stroke-width="3"/><text x="560.6666666666666" y="250" font-size="21" fill="#55e0d2" text-anchor="middle">3</text><circle cx="639.3333333333334" cy="243" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="639.3333333333334" y="250" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="718" cy="243" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="718" y="250" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><rect x="457" y="375" width="286" height="132" rx="18" fill="#121e32" stroke="#425775"/><text x="600" y="408" font-size="22" fill="#b69aff" text-anchor="middle">after B</text><line x1="482" y1="455" x2="560.6666666666666" y2="455" stroke="#425775" stroke-width="3" /><line x1="560.6666666666666" y1="455" x2="639.3333333333334" y2="455" stroke="#425775" stroke-width="3" /><line x1="639.3333333333334" y1="455" x2="718" y2="455" stroke="#425775" stroke-width="3" /><circle cx="482" cy="455" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="482" y="462" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="560.6666666666666" cy="455" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="560.6666666666666" y="462" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="639.3333333333334" cy="455" r="17" fill="#0b1221" stroke="#b69aff" stroke-width="3"/><text x="639.3333333333334" y="462" font-size="21" fill="#b69aff" text-anchor="middle">4</text><circle cx="718" cy="455" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="718" y="462" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><rect x="877" y="269" width="286" height="132" rx="18" fill="#121e32" stroke="#425775"/><text x="1020" y="302" font-size="22" fill="#f1f5fc" text-anchor="middle">same final state</text><line x1="902" y1="349" x2="961" y2="349" stroke="#425775" stroke-width="3" /><line x1="961" y1="349" x2="1020" y2="349" stroke="#425775" stroke-width="3" /><line x1="1020" y1="349" x2="1079" y2="349" stroke="#425775" stroke-width="3" /><line x1="1079" y1="349" x2="1138" y2="349" stroke="#425775" stroke-width="3" /><circle cx="902" cy="349" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="902" y="356" font-size="21" fill="#f1f5fc" text-anchor="middle">0</text><circle cx="961" cy="349" r="17" fill="#0b1221" stroke="#55e0d2" stroke-width="3"/><text x="961" y="356" font-size="21" fill="#55e0d2" text-anchor="middle">3</text><circle cx="1020" cy="349" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="1020" y="356" font-size="21" fill="#f1f5fc" text-anchor="middle">1</text><circle cx="1079" cy="349" r="17" fill="#0b1221" stroke="#b69aff" stroke-width="3"/><text x="1079" y="356" font-size="21" fill="#b69aff" text-anchor="middle">4</text><circle cx="1138" cy="349" r="17" fill="#0b1221" stroke="#f1f5fc" stroke-width="3"/><text x="1138" y="356" font-size="21" fill="#f1f5fc" text-anchor="middle">2</text><path d="M330 310L448 252" fill="none" stroke="#55e0d2" stroke-width="3" marker-end="url(#cyan)"/><path d="M751 249L868 309" fill="none" stroke="#b69aff" stroke-width="3" marker-end="url(#violet)"/><path d="M330 357L448 416" fill="none" stroke="#b69aff" stroke-width="3" marker-end="url(#violet)"/><path d="M751 416L868 357" fill="none" stroke="#55e0d2" stroke-width="3" marker-end="url(#cyan)"/><text x="369" y="265" font-size="25" fill="#55e0d2" text-anchor="start">A</text><text x="810" y="265" font-size="25" fill="#b69aff" text-anchor="start">B</text><text x="369" y="425" font-size="25" fill="#b69aff" text-anchor="start">B</text><text x="810" y="425" font-size="25" fill="#55e0d2" text-anchor="start">A</text><text x="600" y="558" font-size="22" fill="#f1f5fc" text-anchor="middle">A splits edge (0,1). B splits edge (1,2). Either can happen first.</text><line x1="36" y1="592" x2="1164" y2="592" stroke="#425775" stroke-width="3" /><text x="36" y="636" font-size="21" fill="#b3c2d7" text-anchor="start">CAUSAL · each circle is an event, not a spatial node</text><circle cx="175" cy="718" r="28" fill="#0b1221" stroke="#55e0d2" stroke-width="3"/><text x="175" y="725" font-size="21" fill="#55e0d2" text-anchor="middle">A</text><circle cx="175" cy="842" r="28" fill="#0b1221" stroke="#b69aff" stroke-width="3"/><text x="175" y="849" font-size="21" fill="#b69aff" text-anchor="middle">B</text><circle cx="535" cy="780" r="30" fill="#0b1221" stroke="#ffc46b" stroke-width="3"/><text x="535" y="787" font-size="21" fill="#ffc46b" text-anchor="middle">C</text><path d="M210 722L492 770" fill="none" stroke="#55e0d2" stroke-width="3" marker-end="url(#cyan)"/><path d="M210 836L492 791" fill="none" stroke="#b69aff" stroke-width="3" marker-end="url(#violet)"/><text x="327" y="719" font-size="20" fill="#55e0d2" text-anchor="middle">produces (3,1)</text><text x="327" y="855" font-size="20" fill="#b69aff" text-anchor="middle">produces (1,4)</text><text x="581" y="751" font-size="23" fill="#ffc46b" text-anchor="start">C needs both new edges.</text><text x="581" y="786" font-size="21" fill="#f1f5fc" text-anchor="start">It joins (3,1) and (1,4)</text><text x="581" y="820" font-size="21" fill="#f1f5fc" text-anchor="start">into (3,4).</text><text x="36" y="922" font-size="23" fill="#f1f5fc" text-anchor="start">No A → B dependency: A and B do not consume one another’s results.</text><text x="36" y="960" font-size="19" fill="#b3c2d7" text-anchor="start">This small example uses subdivision and joining rules. It is not a claim about quantum interference.</text></g></svg>
